<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Projects | Roshan Mahananda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 min-h-screen">
    <div class="max-w-7xl mx-auto">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
            <div class="mb-4 md:mb-0 text-center md:text-left">
                <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight">Lab Projects Dashboard</h1>
                <p class="text-slate-500 mt-2 font-medium flex items-center justify-center md:justify-start gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Developed by Roshan Mahananda
                </p>
            </div>
            <button onclick="addProject()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl shadow-md hover:bg-indigo-700 hover:shadow-lg transition-all duration-200 font-semibold flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Project
            </button>
        </header>
        
        <main id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8">
        </main>
    </div>

    <script>
        const projects = [
            { name: "Exp 1: Resume", desc: "Create a Resume.", link: "https://roshan-mahananda.github.io/DemoResume/" },
            { name: "Exp 2: Online Shopping", desc: "Create online shopping webpage with Product Details.", link: "https://roshan-mahananda.github.io/ShoppingKart/" },
            { name: "Exp 3: Simple Quiz", desc: "Create simple Quiz with 20 Questions.", link: "https://roshan-mahananda.github.io/quizWeb/" },
            { name: "Exp 4: Scientific Calculator", desc: "Create a scientific calculator.", link: "#" },
            { name: "Exp 5: Employee Details Form", desc: "Employee Details Form with Database.", link: "https://roshan-mahananda.github.io/firebase_editable_form/" },
            { name: "Exp 6: Department Webpage", desc: "Simple Department webpage using a database.", link: "#" },
            { name: "Exp 7: Company Webpage", desc: "Create a Company webpage with Front-end and Backend.", link: "https://roshan-mahananda.github.io/employee-admin-company/" },
            { name: "Exp 8: Contact Management", desc: "Create a contact management application.", link: "https://roshan-mahananda.github.io/contact-management/" }
        ];

        const grid = document.getElementById('project-grid');

        function renderProjects() {
            grid.innerHTML = '';
            projects.forEach((proj) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col justify-between hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group";
                
                const titleParts = proj.name.split(': ');
                const badge = titleParts.length > 1 ? titleParts[0] : 'Project';
                const title = titleParts.length > 1 ? titleParts[1] : proj.name;

                card.innerHTML = `
                    <div class="mb-6">
                        <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-full mb-4 group-hover:bg-indigo-100 transition-colors">${badge}</span>
                        <h2 class="text-xl font-bold text-slate-800 mb-2">${title}</h2>
                        <p class="text-sm text-slate-500 leading-relaxed">${proj.desc}</p>
                    </div>
                    <a href="${proj.link}" target="_blank" class="block w-full text-center bg-slate-800 text-white py-3 rounded-xl hover:bg-indigo-600 shadow-sm hover:shadow transition-all text-sm font-semibold tracking-wide">
                        View Project
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        function addProject() {
            const name = prompt("Enter project name (e.g., Exp 9: New Tool):");
            if (!name) return;
            
            const desc = prompt("Enter short description:");
            if (!desc) return;
            
            const link = prompt("Enter deployed link URL:", "https://");
            if (!link) return;

            projects.push({ name, desc, link });
            renderProjects();
        }

        renderProjects();
    </script>
</body>
</html>
